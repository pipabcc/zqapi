name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: 静态检查
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: 安装 ruff
        run: python -m pip install "ruff>=0.5,<1"
      - name: Ruff 检查
        run: python -m ruff check .

  tests:
    name: 单元测试
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装测试依赖
        run: python -m pip install "pytest>=8.2,<9" "pytest-timeout>=2.3,<3" "PyQt6>=6.5"
      - name: 编译检查
        run: python -m compileall . -x "(build|dist|self-check)"
      - name: 单元测试
        run: python -m pytest tests -q --timeout=120
